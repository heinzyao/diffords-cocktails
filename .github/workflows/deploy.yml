name: Deploy to Cloud Run

on:
  push:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-east1
  BUCKET: diffords-cocktails-data

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build scraper image
        run: |
          docker build \
            -f Dockerfile.diffords \
            -t gcr.io/$PROJECT_ID/diffords-cocktails-scraper:$GITHUB_SHA \
            -t gcr.io/$PROJECT_ID/diffords-cocktails-scraper:latest \
            .

      - name: Push scraper image
        run: docker push --all-tags gcr.io/$PROJECT_ID/diffords-cocktails-scraper

      - name: Deploy scraper job
        run: |
          gcloud run jobs update diffords-cocktails-scraper \
            --image gcr.io/$PROJECT_ID/diffords-cocktails-scraper:$GITHUB_SHA \
            --region $REGION \
          || gcloud run jobs create diffords-cocktails-scraper \
            --image gcr.io/$PROJECT_ID/diffords-cocktails-scraper:$GITHUB_SHA \
            --region $REGION \
            --memory 512Mi \
            --cpu 1 \
            --task-timeout 7200 \
            --set-env-vars GCS_BUCKET=$BUCKET,GCS_DB_BLOB=diffords.db \
            --set-secrets LINE_CHANNEL_ID=DISTILLER_LINE_CHANNEL_ID:latest,LINE_CHANNEL_SECRET=DISTILLER_LINE_CHANNEL_SECRET:latest,LINE_USER_ID=DISTILLER_LINE_USER_ID:latest

      - name: Build bot image
        run: |
          docker build \
            -f Dockerfile.bot \
            -t gcr.io/$PROJECT_ID/diffords-cocktails-bot:$GITHUB_SHA \
            -t gcr.io/$PROJECT_ID/diffords-cocktails-bot:latest \
            .

      - name: Push bot image
        run: docker push --all-tags gcr.io/$PROJECT_ID/diffords-cocktails-bot

      - name: Deploy bot service
        run: |
          gcloud run deploy distiller-bot \
            --image gcr.io/$PROJECT_ID/diffords-cocktails-bot:$GITHUB_SHA \
            --region $REGION \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2 \
            --allow-unauthenticated \
            --set-env-vars GCS_BUCKET=$BUCKET,GCS_DB_BLOB=diffords.db,DIFFORDS_JOB_NAME=diffords-cocktails-scraper \
            --set-secrets LINE_CHANNEL_ID=DISTILLER_LINE_CHANNEL_ID:latest,LINE_CHANNEL_SECRET=DISTILLER_LINE_CHANNEL_SECRET:latest,LINE_USER_ID=DISTILLER_LINE_USER_ID:latest
