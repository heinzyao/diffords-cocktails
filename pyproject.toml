[project]
name = "diffords-cocktails"
version = "3.0.0"
description = "以 Difford's Guide 為資料來源的雞尾酒酒譜爬蟲、SQLite 查詢工具與 LINE Bot"
requires-python = ">=3.9"
dependencies = [
    "requests",
    "flask",
    "beautifulsoup4",
    "lxml",
    "python-dotenv",
    "google-cloud-storage>=3.9.0",
    "google-cloud-run>=0.15.0",
    "gunicorn>=23.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]
